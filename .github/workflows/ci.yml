name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Smoke-test the CLI
        run: node dist/cli.js --version

  desktop:
    name: Tray app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build the tray app (unpacked)
        working-directory: desktop
        run: |
          npm ci
          npm run icons
          npm run prepare-relay
          npx electron-builder --dir --publish never
      - name: Bundled relay runs without node_modules
        working-directory: desktop/build/relay
        run: node dist/cli.js --version

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t crosschat-relay:ci .
      - name: Start and wait for the health check
        run: |
          docker run -d --name relay -p 4318:4318 crosschat-relay:ci
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' relay)" = "healthy" ]; then
              curl -fsS http://localhost:4318/health
              exit 0
            fi
            sleep 2
          done
          docker logs relay
          exit 1
      - name: Container runs as a non-root user
        run: test "$(docker exec relay id -u)" != "0"
